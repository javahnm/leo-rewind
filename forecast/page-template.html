<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leo's Forecast</title>
<meta name="description" content="Leo the cat's day ahead: when he'll go out, pop in for a snack, and be home for dinner.">
<meta property="og:title" content="Leo's Forecast">
<meta property="og:description" content="When to have Leo's dinner ready, and the rest of his day ahead.">
<meta name="theme-color" content="#f4f5f7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%88%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a cat's day planner. Each day: one short story, then a meal-time list (time on the left, what to do on the right). */
:root{
  --page:#f4f5f7; --card:#ffffff; --ink:#16191e; --ink-2:#4b525c; --muted:#7d848f; --line:#e3e6eb;
  --out:#eb6834; --out-bg:#fde8de; --out-ink:#8a3a12; --home-bg:#e6eefb; --home-ink:#1f4f8f;
  --good:#0c6b0c; --good-bg:#e1f2df; --none:#6b7280;
  --f-display:"Bricolage Grotesque", "Inter", system-ui, sans-serif; --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#101215; --card:#1a1d22; --ink:#eef0f3; --ink-2:#c0c6cf; --muted:#8c939d; --line:#2b3037;
  --out:#d95926; --out-bg:#3b2014; --out-ink:#f4ab89; --home-bg:#18263a; --home-ink:#9cc0ef;
  --good:#7fd67f; --good-bg:#173019; --none:#9aa1ab; color-scheme:dark;}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:28px 56px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:clamp(2.2rem,8vw,3.1rem);font-weight:800;letter-spacing:-.02em;line-height:1}
h2{font-size:1.4rem;font-weight:800}
h3{font-size:1.35rem;font-weight:800}
p{margin:0}
.hero{display:flex;flex-direction:column;gap:8px}
.hero .cat svg{max-height:64px}
.updated{color:var(--muted);font-size:.9rem}
.day{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:16px}
.day.today{border:2px solid var(--out)}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.wx{color:var(--muted);font-size:.9rem}
.now{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;border-radius:999px;padding:6px 14px;font-weight:600;font-size:.95rem}
.now.out{background:var(--out-bg);color:var(--out-ink)} .now.home{background:var(--home-bg);color:var(--home-ink)}
.now i{width:9px;height:9px;border-radius:50%;background:currentColor}
@media (prefers-reduced-motion: no-preference){.now i{animation:pulse 2s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.3}}
.story{font-size:1.08rem;color:var(--ink)}
.meals{display:flex;flex-direction:column}
.meal{display:grid;grid-template-columns:7.2rem 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line);align-items:baseline}
.meal .when{display:flex;flex-direction:column;line-height:1.2}
.meal .when b{font-family:var(--f-display);font-size:1.3rem;font-weight:800}
.meal .when span{font-size:.76rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.meal p{color:var(--ink-2)}
.meal.key{background:var(--out-bg);border-radius:14px;padding:12px 14px;border-top:0;margin:4px -6px}
.meal.key p{color:var(--ink)}
.meal.key .when b{color:var(--out-ink)}
.meal.skip .when b{color:var(--none)}
.meal.done .when b{color:var(--muted)}
.score{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px}
.score p{color:var(--ink-2)}
.score p b{color:var(--ink)}
details summary{cursor:pointer;font-weight:600;color:var(--ink);padding:6px 0}
.tbl{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:.74rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.res{display:inline-block;font-size:.76rem;font-weight:600;padding:2px 8px;border-radius:999px;margin-left:6px}
.res.hit{background:var(--good-bg);color:var(--good)} .res.miss{background:var(--out-bg);color:var(--out-ink)}
.foot{font-size:.85rem;color:var(--muted)}
@media (max-width:520px){.meal{grid-template-columns:5.6rem 1fr;gap:10px}.meal .when b{font-size:1.12rem}}
__CATCSS__
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="cat anim" data-scene="stroll"></div>
    <h1>Leo's Forecast</h1>
    <p class="updated" id="updated">Fetching Leo's plans…</p>
  </header>
  <div id="days" style="display:flex;flex-direction:column;gap:18px"></div>
  <section class="score" id="score"></section>
  <p class="foot">Worked out from Leo's AirTag, the Milton Keynes weather and a little maths. He's a cat, so he doesn't always read the forecast.</p>
</div>
<script>
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
__CATLIB__
</script>
<script>
const DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const toH=s=>{if(!s)return null;const [h,m]=s.split(':').map(Number);return h+m/60};
const fmt=x=>{if(x==null)return'–';x=((x%24)+24)%24;let h=Math.floor(x),m=Math.round((x-h)*60);if(m===60){h=(h+1)%24;m=0}
  if(h===0&&m===0)return'midnight';if(h===12&&m===0)return'noon';const ap=h<12?'am':'pm';const hh=h%12||12;return m?`${hh}:${String(m).padStart(2,'0')}${ap}`:`${hh}${ap}`};
const r5=x=>Math.round(x*12)/12, q15down=x=>Math.floor(x*4)/4, q15=x=>Math.round(x*4)/4;
const dname=d=>{const x=new Date(d+'T12:00:00Z');return DOWL[x.getUTCDay()]};
const ddate=d=>{const x=new Date(d+'T12:00:00Z');return `${x.getUTCDate()} ${x.toLocaleString('en-GB',{month:'long',timeZone:'UTC'})}`};
const mins=m=>m>=55&&m<=85?'about an hour':m>=110&&m<=130?'about two hours':`${m} minutes`;
const sky=w=>{const t=w.t_min<1?'frosty':w.t_min<4?'chilly':'mild';const r=w.rain_mm>=1?'wet':w.rain_mm>0?'mostly dry':'dry';return `${t} and ${r}`};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function meal(when,label,text,cls=''){return `<div class="meal ${cls}"><div class="when"><span>${label}</span><b>${when}</b></div><p>${text}</p></div>`}

function plan(d,H,late,o={}){
  const exit=toH(d.exit),tea=toH(d.tea),snack=toH(H.snack),bed=toH(H.bedtime);
  const ready=q15(tea-10/60), rows=[];
  rows.push(o.breakfastDone ? meal(fmt(exit),'Breakfast',o.breakfastDone,'done')
    : meal(`by ${fmt(q15down(exit-10/60))}`,'Breakfast',`He'll be heading out around ${fmt(r5(exit))}, so have breakfast down before then.`));
  if(o.snackDone) rows.push(meal(o.snackDone[0],'Snack',o.snackDone[1],'done'));
  else if(snack!=null) rows.push(meal(`~${fmt(q15(snack))}`,'Snack',`He often pops back mid-morning for a quick bite (${H.snack_days[0]} of the last ${H.snack_days[1]} days). Leave a little something out.`));
  rows.push(meal('Not home','Lunch',`Don't wait for him. He's been out every lunchtime.`,'skip'));
  rows.push(o.teaDone ? meal(fmt(tea),'Dinner',o.teaDone,'done')
    : meal(fmt(ready),'Dinner',`<b>Get his dinner ready for ${fmt(ready)}.</b> He should be home around ${fmt(r5(tea))}${d.tea_range?`, usually between ${fmt(q15(toH(d.tea_range[0])))} and ${fmt(q15(toH(d.tea_range[1])))}`:''}, as it gets dark.`,'key'));
  rows.push(meal(`~${fmt(q15(bed))}`,'Bedtime',`He's usually in for the night by about ${fmt(q15(bed))}. He's been out after 10pm on ${late[0]} of the last ${late[1]} nights, so check on him at 10:30pm if he's not back.`));
  return `<div class="meals">${rows.join('')}</div>`;
}

function render(F){
  const g=new Date(F.generated);
  document.getElementById('updated').textContent=`Updated ${g.toLocaleString('en-GB',{weekday:'long',hour:'numeric',minute:'2-digit',hour12:true,timeZone:'Europe/London'})}`;
  const H=F.habits||{snack:null,snack_days:[0,0],bedtime:'21:30'}, late=F.late_nights||[0,0];
  const box=document.getElementById('days'); box.innerHTML='';

  if(F.today){
    const d=F.today,w=d.weather,ev=d.events||[],now=toH(d.now), s=[];
    if(d.exit_actual){const e=d.exit_err_min;
      const vs=e==null||Math.abs(e)<=20?'right on time':e>0?`${mins(e)} later than we expected`:`${mins(-e)} earlier than we expected`;
      s.push(`Leo headed out at ${fmt(toH(d.exit_actual))}, ${vs}${e>20&&w.t_min<1?' (frosty mornings seem to slow him down)':''}.`);
    } else s.push(`Leo hasn't gone out yet this morning.`);
    let snackDone=null;
    for(let i=0;i<ev.length-1;i++){const back=ev[i].back,next=ev[i+1];
      if(back&&next.out){const gap=Math.round((toH(next.out)-toH(back))*60), sn=toH(back)>=9.5&&toH(back)<=12&&gap<=40;
        if(sn) snackDone=[fmt(toH(back)),`Popped in at ${fmt(toH(back))} for ${gap} minutes.`];
        s.push(sn?`He popped home at ${fmt(toH(back))} for a ${gap}-minute snack, then went back out at ${fmt(toH(next.out))}.`:`He came home at ${fmt(toH(back))} and went out again at ${fmt(toH(next.out))}.`);}}
    s.push(d.state==='out'?`He's out now, and has been since ${fmt(toH(d.since))}.`:`He's home now, since ${fmt(toH(d.since))}.`);
    if(!snackDone&&now>12) snackDone=['–','No snack visit this morning.'];
    const dd={exit:d.exit_actual||d.exit_expected,tea:d.tea_actual||d.tea_expected,tea_range:d.tea_actual?null:d.tea_range};
    const el=document.createElement('article');el.className='day today';
    el.innerHTML=`<div class="dh"><h3>Today</h3><span class="wx">${ddate(d.date)} · ${sky(w)} · dark by ${fmt(toH(w.sunset))}</span></div>
      <span class="now ${d.state}"><i></i>${d.state==='out'?'Out':'Home'} right now <span style="font-weight:400">· as of ${fmt(now)}</span></span>
      <p class="story">${s.join(' ')}</p>
      ${plan(dd,H,late,{breakfastDone:d.exit_actual?`Went out at ${fmt(toH(d.exit_actual))}.`:null,snackDone,teaDone:d.tea_actual?`Home for dinner at ${fmt(toH(d.tea_actual))}.`:null})}`;
    box.appendChild(el);
  }

  F.days.forEach((d,i)=>{
    const w=d.weather, exit=toH(d.exit), tea=toH(d.tea), label=i===0?'Tomorrow':dname(d.date);
    const story=`${label} looks ${sky(w)}, dark by ${fmt(toH(w.sunset))}. Leo should head out around ${fmt(r5(exit))}${w.t_min<1?' (a bit later if it\'s frosty)':''}, maybe pop back for a snack mid-morning, and spend lunchtime out. Get his dinner ready for ${fmt(q15(tea-10/60))}: he should be home around ${fmt(r5(tea))}.`;
    const el=document.createElement('article');el.className='day';
    el.innerHTML=`<div class="dh"><h3>${label}</h3><span class="wx">${dname(d.date)} ${ddate(d.date)}</span></div>
      ${d.note?`<p class="story" style="background:var(--out-bg);padding:10px 14px;border-radius:12px">Note: ${esc(d.note)}</p>`:''}
      <p class="story">${story}</p>${plan(d,H,late)}`;
    box.appendChild(el);
  });

  const live=F.scorecard.live, bt=F.scorecard.backtest, sc=document.getElementById('score');
  const isLive=!!(live&&live.summary), sum=isLive?live.summary:bt.summary, of=(x,n)=>`${Math.round(x*n)} of ${n}`;
  let t=`<h2>How are the guesses doing?</h2><p>We write each guess down before the day starts, then check it against what Leo really did. A guess counts as right if it's within 45 minutes.</p>`;
  t+=isLive?`<p>So far, dinner-time guesses were right on <b>${of(sum.tea_hit,sum.days)} days</b>, and morning guesses on <b>${of(sum.exit_hit,sum.days)} days</b>.</p>`
           :`<p>Tested on last week, dinner-time guesses were right on <b>${of(sum.tea_hit,sum.days)} days</b>, and morning guesses on <b>${of(sum.exit_hit,sum.days)} days</b>. Real tracking starts with today.</p>`;
  if(F.today&&F.today.exit_err_min!=null){const e=F.today.exit_err_min;
    t+=`<p>Today we guessed he'd go out at ${fmt(toH(F.today.exit_expected))}, and he went at ${fmt(toH(F.today.exit_actual))}. ${Math.abs(e)<=45?'Close enough ✓':'A miss, and the model will learn from it.'}</p>`;}
  const cell=(p,a,e,hit)=>`${fmt(toH(p))} → ${fmt(toH(a))}${hit==null?'':`<span class="res ${hit?'hit':'miss'}">${hit?'✓':`✗ ${Math.abs(e)} min`}</span>`}`;
  const rows=[...(live.days||[]),...bt.days.map(r=>({...r,test:true}))].reverse();
  t+=`<details><summary>See every guess vs what happened</summary><div class="tbl"><table><thead><tr><th>Day</th><th>Out: guess → real</th><th>Dinner: guess → real</th></tr></thead><tbody>${
    rows.map(r=>`<tr><td>${dname(r.date)} ${ddate(r.date)}${r.test?' <span style="color:var(--muted)">(test)</span>':''}</td><td>${cell(r.exit_pred,r.exit_actual,r.exit_err_min,r.exit_hit)}</td><td>${cell(r.tea_pred,r.tea_actual,r.tea_err_min,r.tea_hit)}</td></tr>`).join('')}</tbody></table></div></details>`;
  sc.innerHTML=t;
}
fetch('forecast.json',{cache:'no-store'}).then(r=>r.json()).then(render).catch(()=>{document.getElementById('updated').textContent='The forecast is having a nap. Try again in a minute.'});
</script>
</body>
</html>
