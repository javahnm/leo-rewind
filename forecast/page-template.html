<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leo's Forecast</title>
<meta name="description" content="What Leo the cat needs next: breakfast, snack, dinner or bedtime.">
<meta property="og:title" content="Leo's Forecast">
<meta property="og:description" content="What Leo the cat needs next.">
<meta name="theme-color" content="#f4f5f7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%88%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one screen, one answer. Status pill, then a single "next up" card. */
:root{
  --page:#f4f5f7; --card:#ffffff; --ink:#16191e; --ink-2:#4b525c; --muted:#7d848f; --line:#e3e6eb;
  --out:#eb6834; --out-bg:#fde8de; --out-ink:#8a3a12; --home-bg:#e6eefb; --home-ink:#1f4f8f; --warn-bg:#fff1cc; --warn-ink:#7a5200;
  --f-display:"Bricolage Grotesque", "Inter", system-ui, sans-serif; --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#101215; --card:#1a1d22; --ink:#eef0f3; --ink-2:#c0c6cf; --muted:#8c939d; --line:#2b3037;
  --out:#d95926; --out-bg:#3b2014; --out-ink:#f4ab89; --home-bg:#18263a; --home-ink:#9cc0ef; --warn-bg:#352a10; --warn-ink:#f0d48a; color-scheme:dark;}}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px}
.wrap{max-width:560px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:22px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.6rem;margin:0;letter-spacing:-.01em}
.top .cat{width:150px;flex:none}
.top .cat svg{max-height:44px}
.now{display:inline-flex;align-items:center;gap:9px;align-self:flex-start;border-radius:999px;padding:8px 16px;font-weight:600}
.now.out{background:var(--out-bg);color:var(--out-ink)} .now.home{background:var(--home-bg);color:var(--home-ink)}
.now i{width:9px;height:9px;border-radius:50%;background:currentColor}
@media (prefers-reduced-motion: no-preference){.now i{animation:pulse 2s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.3}}
.next{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:28px 26px 30px;display:flex;flex-direction:column;gap:10px}
.next.warn{background:var(--warn-bg);border-color:transparent}
.label{font-size:.8rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.what{font-family:var(--f-display);font-weight:800;font-size:clamp(2.1rem,9vw,3rem);line-height:1.02;letter-spacing:-.02em;text-wrap:balance}
.what em{font-style:normal;color:var(--out)}
.why{font-size:1.1rem;color:var(--ink-2)}
.count{font-size:.95rem;color:var(--muted)}
.fresh{font-size:.82rem;color:var(--muted)}
__CATCSS__
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><h1>Leo</h1><div class="cat anim" data-scene="stroll"></div></div>
  <span class="now" id="now" hidden><i></i><span></span></span>
  <section class="next" id="next">
    <span class="label">Next up</span>
    <div class="what">Checking on Leo…</div>
  </section>
  <p class="fresh" id="fresh"></p>
</main>
<script>
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
__CATLIB__
</script>
<script>
const toH=s=>{if(!s)return null;const [h,m]=s.split(':').map(Number);return h+m/60};
const fmt=x=>{if(x==null)return'–';x=((x%24)+24)%24;let h=Math.floor(x),m=Math.round((x-h)*60);if(m===60){h=(h+1)%24;m=0}
  if(h===12&&m===0)return'noon';const ap=h<12?'am':'pm';const hh=h%12||12;return m?`${hh}:${String(m).padStart(2,'0')}${ap}`:`${hh}${ap}`};
const q15=x=>Math.round(x*4)/4, r5=x=>Math.round(x*12)/12;
const ukParts=()=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {date:`${p.year}-${p.month}-${p.day}`,h:+p.hour+(+p.minute)/60}};
const inT=(from,to)=>{const m=Math.round((to-from)*60);if(m<=0)return'';if(m<60)return`in ${m} min`;const h=Math.floor(m/60),r=m%60;return`in ${h}h${r?` ${String(r).padStart(2,'0')}m`:''}`};
let F=null;

// today's plan: the live card if it's for today, otherwise today's forecast from the day list
const STALE_MIN=150;
const isStale=F=>(Date.now()-new Date(F.generated))/60000>STALE_MIN;
// Live status straight from the scanner (it posts on every out/home change + every 20 min).
const LIVE_URL='https://ntfy.sh/leo-live-8texlivbayux3f4mkn9d/json?poll=1&since=3h';
let L=null;
const liveFresh=()=>!!(L&&Date.now()-L.ts<45*60000);
const ukHM=ms=>new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(ms));
async function loadLive(){
  try{
    const txt=await (await fetch(LIVE_URL,{cache:'no-store'})).text();
    let best=null;
    for(const line of txt.split('\n')){
      let e,m; try{e=JSON.parse(line);m=JSON.parse(e.message)}catch(_){continue}
      // only well-formed status messages; anything else on the channel is ignored
      if(e.event!=='message'||!m||m.v!==1||typeof m.away!=='boolean'||typeof m.ts!=='number'||m.ts>Date.now()+120000||m.ts<Date.now()-864e5) continue;
      if(!best||m.ts>best.ts) best=m;
    }
    if(best){L=best;render();}
  }catch(_){}
}
function today(F,date){
  const base=todayBase(F,date); if(!base) return null;
  if(liveFresh()){const st=L.away?'out':'home', same=base.state===st;
    return {...base,state:st,since:L.since>0?ukHM(L.since):(same?base.since:null)};}
  return isStale(F)?{...base,state:null}:base;
}
// Fallback for days not in the published forecast: Leo's learned habits + today's sun times,
// fetched by the browser itself (no server, no Mac).
let SUN={};
async function loadSun(){
  try{const r=await (await fetch('https://api.open-meteo.com/v1/forecast?latitude=52.04&longitude=-0.76&daily=sunrise,sunset,temperature_2m_min,temperature_2m_max,precipitation_sum&timezone=Europe%2FLondon&forecast_days=3')).json();
    r.daily.time.forEach((d,i)=>SUN[d]={sunrise:r.daily.sunrise[i].slice(11),sunset:r.daily.sunset[i].slice(11),t_min:r.daily.temperature_2m_min[i],t_max:r.daily.temperature_2m_max[i],rain_mm:r.daily.precipitation_sum[i]});
    render();}catch(_){}
}
function fromHabits(F,date){
  const P=F.params, s=SUN[date]; if(!P||!s) return null;
  const we=[0,6].includes(new Date(date+'T12:00:00Z').getUTCDay()), ex=we?P.exit_weekend_min:P.exit_weekday_min, tv=P.tea_vs_sunset_min;
  const sr=toH(s.sunrise), ss=toH(s.sunset), hm=x=>{const h=Math.floor(x),m=Math.round((x-h)*60);return `${String(h).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`};
  return {date,exit:hm(sr+ex[0]/60),tea:hm(ss+tv[0]/60),tea_range:[hm(ss+tv[1]/60),hm(ss+tv[2]/60)],weather:s};
}
function todayBase(F,date){
  if(F.today&&F.today.date===date) return F.today;
  const d=(F.days||[]).find(x=>x.date===date)||fromHabits(F,date);
  return d?{date,state:null,since:null,events:[],exit_actual:null,exit_expected:d.exit,tea_actual:null,tea_expected:d.tea,tea_range:d.tea_range,weather:d.weather}:null;
}
function tomorrowExit(F,date){let d=(F.days||[]).find(x=>x.date>date);
  if(!d){const k=Object.keys(SUN).find(x=>x>date); d=k&&fromHabits(F,k);} return d?toH(d.exit):null}

function decide(F){
  const {date,h}=ukParts(), T=today(F,date), H=F.habits||{}, snack=toH(H.snack), bed=toH(H.bedtime)||21.5;
  if(!T) return {label:'Next up',what:'Waiting for fresh data',why:'The forecast will be back shortly.'};
  if(T.state==null) return byClock(T,h,snack,bed,F,date);
  const out=T.state==='out', exitE=toH(T.exit_expected), tea=toH(T.tea_expected), teaEnd=T.tea_range?toH(T.tea_range[1]):tea+.75;
  const left=!!T.exit_actual||out||(T.events||[]).length>0||(!T.exit_actual&&!(T.events||[]).length&&h>exitE+1);
  const popped=(T.events||[]).some((e,i,a)=>e.back&&a[i+1]&&toH(e.back)>=9.5&&toH(e.back)<=12);
  const teaDone=!!T.tea_actual||(!out&&h>=13&&left);
  const bfast=x=>({label:'Breakfast',what:`Have it down by <em>${fmt(q15(x-10/60))}</em>`,why:`He'll head out around ${fmt(r5(x))}.`,at:q15(x-10/60)});

  if(h<5) return bfast(exitE);
  if(!left) return bfast(exitE);
  if(!teaDone&&h<12&&snack&&!popped&&h<snack+.75){
    if(!out) return {label:'Snack',what:'He\'s popped in',why:'Probably after a snack. He\'ll likely head out again soon.'};
    return {label:'Snack',what:`Around <em>${fmt(q15(snack))}</em>`,why:'He often pops in mid-morning. Leave a little something out.',at:q15(snack)};
  }
  if(!teaDone){
    const ready=q15(tea-10/60);
    if(h<tea) return {label:'Dinner',what:`Get it ready for <em>${fmt(ready)}</em>`,why:`He should be home around ${fmt(r5(tea))}.`,at:ready};
    if(h<teaEnd) return {label:'Dinner',what:'He\'s due home <em>any minute</em>',why:`He's usually back by ${fmt(q15(teaEnd))}.`};
    return {label:'Dinner',what:'Running late for dinner',why:`He's usually home by ${fmt(q15(teaEnd))}. Worth a look outside.`,warn:true};
  }
  if(out&&h>=22.5) return {label:'Bedtime',what:'Time to call him in',why:`He's still out, and it's past 10:30pm.`,warn:true};
  if(out) return {label:'Bedtime',what:`Check on him at <em>10:30pm</em>`,why:'He\'s out for an evening stroll. He\'s usually back within the hour.',at:22.5};
  if(h<bed) return {label:'Bedtime',what:`He's in for the night by <em>~${fmt(q15(bed))}</em>`,why:'If he pops out again, check on him at 10:30pm.',at:q15(bed)};
  const te=tomorrowExit(F,date);
  return te?{...bfast(te),label:'Tomorrow\'s breakfast',at:null}:{label:'Bedtime',what:'He\'s in for the night',why:'Sleep well, Leo.'};
}

function byClock(T,h,snack,bed,F,date){  // live data paused: follow his usual day
  const exitE=toH(T.exit_actual||T.exit_expected), tea=toH(T.tea_actual||T.tea_expected), teaEnd=T.tea_range?toH(T.tea_range[1]):tea+.75;
  const bfast=x=>({label:'Breakfast',what:`Have it down by <em>${fmt(q15(x-10/60))}</em>`,why:`He usually heads out around ${fmt(r5(x))}.`,at:q15(x-10/60)});
  if(h<exitE) return bfast(exitE);
  if(snack&&h<snack+.5) return {label:'Snack',what:`Around <em>${fmt(q15(snack))}</em>`,why:'He often pops in mid-morning. Leave a little something out.',at:q15(snack)};
  if(h<tea) return {label:'Dinner',what:`Get it ready for <em>${fmt(q15(tea-10/60))}</em>`,why:`He's usually home around ${fmt(r5(tea))}.`,at:q15(tea-10/60)};
  if(h<teaEnd) return {label:'Dinner',what:'He\'s due home <em>about now</em>',why:`He's usually back by ${fmt(q15(teaEnd))}.`};
  if(h<22.5) return {label:'Bedtime',what:`Check he's in by <em>10:30pm</em>`,why:`He's usually in for the night by about ${fmt(q15(bed))}.`,at:22.5};
  const te=tomorrowExit(F,date);
  return te?{...bfast(te),label:'Tomorrow\'s breakfast',at:null}:{label:'Bedtime',what:'He should be in for the night',why:'Sleep well, Leo.'};
}

function render(){
  if(!F) return;
  const {h,date}=ukParts(), n=decide(F), T=today(F,date);
  const pill=document.getElementById('now');
  const stale=!T||T.state==null;
  if(stale) pill.hidden=true;
  else if(T&&T.since){pill.hidden=false;pill.className=`now ${T.state}`;pill.querySelector('span').textContent=`${T.state==='out'?'Out':'Home'} since ${fmt(toH(T.since))}`;}
  const el=document.getElementById('next');
  el.className='next'+(n.warn?' warn':'');
  el.innerHTML=`<span class="label">Next up · ${n.label}</span><div class="what">${n.what}</div>${n.why?`<p class="why">${n.why}</p>`:''}${n.at!=null&&n.at>h?`<p class="count">${inT(h,n.at)}</p>`:''}`;
  const age=Math.round((Date.now()-new Date(F.generated))/60000);
  document.getElementById('fresh').textContent=stale?`Following his usual routine. Live updates paused (last one ${age<1440?Math.round(age/60)+' h':Math.round(age/1440)+' days'} ago).`
    :(()=>{const a2=liveFresh()?Math.round((Date.now()-L.ts)/60000):age;return a2<2?'Live · just updated':`Live · updated ${a2} min ago`})();
}
async function load(){try{const r=await fetch(`forecast.json?t=${Date.now()}`,{cache:'no-store'});F=await r.json();render();}catch(e){}}
load(); loadLive(); loadSun(); setInterval(loadSun,6*3600000); setInterval(load,300000); setInterval(loadLive,60000); setInterval(render,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){load();loadLive()}});
</script>
</body>
