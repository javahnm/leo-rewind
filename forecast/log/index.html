<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leo's Brain</title>
<meta name="description" content="What Leo's forecast is thinking right now, and how it changed its mind today.">
<meta name="theme-color" content="#f6f1f4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Leo's brain: the forecast speaking in first person. One big "right now" thought, then today's train of thought, newest first. */
:root{
  --page:#f6f1f4; --card:#ffffff; --ink:#1b1820; --ink-2:#4f4a57; --muted:#857f8e; --line:#ebe3ea;
  --brain:#f4a9bd; --brain-2:#e9809e; --brain-ink:#8f2c4b; --spark:#ffb547;
  --out:#e2622c; --out-bg:#fde8de; --out-ink:#8a3a12; --home:#2f6fd1; --home-bg:#e6eefb; --home-ink:#1f4f8f;
  --win-bg:#e3f5e8; --win-ink:#1f6b3a;
  --f-display:"Bricolage Grotesque", "Inter", system-ui, sans-serif; --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#141116; --card:#1d1920; --ink:#f1edf3; --ink-2:#c3bcc9; --muted:#918a99; --line:#2e2832;
  --brain:#b95f7c; --brain-2:#d97a98; --brain-ink:#f6b9cb; --spark:#ffc46b;
  --out-bg:#3a2218; --out-ink:#f6b493; --home-bg:#1b2a40; --home-ink:#a9c6f3; --win-bg:#173323; --win-ink:#9fe0b4;}}
:root[data-theme="dark"]{
  --page:#141116; --card:#1d1920; --ink:#f1edf3; --ink-2:#c3bcc9; --muted:#918a99; --line:#2e2832;
  --brain:#b95f7c; --brain-2:#d97a98; --brain-ink:#f6b9cb; --spark:#ffc46b;
  --out-bg:#3a2218; --out-ink:#f6b493; --home-bg:#1b2a40; --home-ink:#a9c6f3; --win-bg:#173323; --win-ink:#9fe0b4;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:400 16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:28px 16px 56px;display:flex;flex-direction:column;gap:20px}
.head{display:flex;align-items:center;gap:16px}
.brain{width:92px;flex:none}
.brain svg{display:block;width:100%;height:auto;overflow:visible}
.brain .lobe{fill:var(--brain)} .brain .fold{fill:none;stroke:var(--brain-2);stroke-width:3.2;stroke-linecap:round}
.brain .spark{fill:var(--spark);opacity:0}
@media (prefers-reduced-motion: no-preference){
  .brain .spark{animation:zap 2.4s ease-in-out infinite}
  .brain .spark:nth-of-type(2){animation-delay:.8s} .brain .spark:nth-of-type(3){animation-delay:1.6s}
  .brain svg{animation:think 4s ease-in-out infinite;transform-origin:50% 60%}
  .dots i{animation:blink 1.4s infinite} .dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}
}
@keyframes zap{0%,100%{opacity:0;transform:scale(.6)}40%{opacity:1;transform:scale(1)}}
@keyframes think{50%{transform:scale(1.03) rotate(-1deg)}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.brain .spark{transform-box:fill-box;transform-origin:center}
h1{font-family:var(--f-display);font-weight:800;font-size:1.9rem;margin:0;letter-spacing:-.01em;line-height:1.1}
.sub{margin:4px 0 0;color:var(--ink-2)}
.now{position:relative;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:24px 22px 22px;display:flex;flex-direction:column;gap:12px}
.now:before,.now:after{content:"";position:absolute;background:var(--card);border:1px solid var(--line);border-radius:50%}
.now:before{width:22px;height:22px;left:40px;top:-30px} .now:after{width:12px;height:12px;left:30px;top:-48px}
.tag{font-size:.78rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.dots{display:inline-flex;gap:3px} .dots i{width:5px;height:5px;border-radius:50%;background:var(--brain-2);display:block}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7rem,6.5vw,2.3rem);line-height:1.12;letter-spacing:-.015em;margin:0;text-wrap:balance}
.big em{font-style:normal;color:var(--brain-2)}
.say{margin:0;color:var(--ink-2);font-size:1.05rem}
.clues{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.clue{font-size:.88rem;background:var(--page);border-radius:999px;padding:6px 12px;color:var(--ink-2)}
h2{font-family:var(--f-display);font-weight:800;font-size:1.2rem;margin:8px 0 0}
.stream{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.th{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:start}
.th time{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;padding-top:14px;text-align:right}
.bub{background:var(--card);border:1px solid var(--line);border-radius:6px 20px 20px 20px;padding:12px 15px;display:flex;flex-direction:column;gap:6px}
.bub .ev{font-weight:600;display:flex;align-items:center;gap:8px}
.bub .ev:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.bub.out .ev:before{background:var(--out)} .bub.home .ev:before{background:var(--home)}
.bub p{margin:0;color:var(--ink-2)}
.bub .guess{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.pill{font-size:.82rem;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--page);color:var(--ink-2)}
.pill.later{background:var(--out-bg);color:var(--out-ink)} .pill.earlier{background:var(--home-bg);color:var(--home-ink)}
.bub.result{background:var(--win-bg);border-color:transparent}
.bub.result .ev:before{background:var(--win-ink)}
.bub.result p{color:var(--ink)}
.fresh{font-size:.82rem;color:var(--muted);margin:0}
a{color:inherit}
.empty{color:var(--muted);margin:0}
</style>
</head>
<body>
<main class="wrap">
  <div class="head">
    <div class="brain" aria-hidden="true"><svg viewBox="0 0 120 100">
      <path class="lobe" d="M58 14c-6-8-20-9-27-2-9-2-18 5-18 14-8 3-12 12-8 20-5 6-4 16 3 21 0 9 9 15 18 13 5 7 16 9 23 3 3 1 6 1 9 0z"/>
      <path class="lobe" d="M62 14c6-8 20-9 27-2 9-2 18 5 18 14 8 3 12 12 8 20 5 6 4 16-3 21 0 9-9 15-18 13-5 7-16 9-23 3-3 1-6 1-9 0z"/>
      <path class="fold" d="M60 16v66M35 22c6 2 9 8 7 14M20 40c8-2 15 3 16 10M24 64c6-6 15-5 19 1M44 80c0-6 4-10 10-11M85 22c-6 2-9 8-7 14M100 40c-8-2-15 3-16 10M96 64c-6-6-15-5-19 1M76 80c0-6-4-10-10-11"/>
      <circle class="spark" cx="30" cy="10" r="5"/><circle class="spark" cx="104" cy="18" r="4"/><circle class="spark" cx="112" cy="70" r="4.5"/>
    </svg></div>
    <div><h1>Leo's brain</h1><p class="sub">What the forecast is thinking about Leo, and why it keeps changing its mind.</p></div>
  </div>

  <section class="now" id="now"><span class="tag">Thinking<span class="dots"><i></i><i></i><i></i></span></span><p class="big">Listening for Leo…</p></section>

  <h2>Today's train of thought</h2>
  <ol class="stream" id="stream"></ol>
  <p class="fresh" id="fresh"></p>
  <p class="fresh"><a href="../">← Back to Leo's forecast</a></p>
</main>
<script>
const toH=s=>{if(!s)return null;const [h,m]=s.split(':').map(Number);return h+m/60};
const fmt=x=>{if(x==null)return'–';x=((x%24)+24)%24;let h=Math.floor(x),m=Math.round((x-h)*60);if(m===60){h=(h+1)%24;m=0}
  if(h===12&&m===0)return'noon';const ap=h<12?'am':'pm';const hh=h%12||12;return m?`${hh}:${String(m).padStart(2,'0')}${ap}`:`${hh}${ap}`};
const q15=x=>Math.round(x*4)/4;
const dur=m=>{m=Math.round(m);if(m<60)return`${m} minutes`;const h=Math.floor(m/60),r=m%60;return `${h} hour${h>1?'s':''}${r?` ${r} min`:''}`};
const uk=ms=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(ms)).map(x=>[x.type,x.value]));
  return {date:`${p.year}-${p.month}-${p.day}`,h:+p.hour+(+p.minute)/60}};
function hazP(M,x){if(!M)return .05;if(M.type==='const')return M.p;let z=M.b;M.names.forEach((n,i)=>{const v=x[n];z+=M.w[i]*((v==null?M.mean[i]:v)-M.mean[i])/M.scale[i]});return 1/(1+Math.exp(-z))}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const SIMC={};
function simulateRest(F,date,h,out,sinceH,sunsetH){
  const key=[date,out,sinceH,Math.ceil(h*4)].join('|'); if(SIMC[key])return SIMC[key];
  const Mo=F.model; if(!Mo)return null;
  const we=[0,6].includes(new Date(date+'T12:00:00Z').getUTCDay())?1:0, rand=rng(key.split('').reduce((a,c)=>a*31+c.charCodeAt(0)|0,7));
  const start=Math.ceil(h*4)/4, N=2000, leaves=[], backs=[];
  for(let r=0;r<N;r++){let st=out,d=Math.max(0,(h-(sinceH??h))*60),lv=null,bk=null;
    for(let s=start;s<24;s+=.25){const tt=s*2*Math.PI/24,x={c1:Math.cos(tt),s1:Math.sin(tt),c2:Math.cos(2*tt),s2:Math.sin(2*tt),weekend:we,sunset:sunsetH-s,dur:Math.log1p(d)};
      const p=st?hazP(Mo.return,x):hazP(Mo.leave,x);
      if(rand()<p){ if(!st){if(lv==null)lv=s+.25} else {if(bk==null&&(out||lv!=null))bk=s+.25} st=!st;d=0;} else d+=15;
      if(bk!=null&&(out||lv!=null))break;}
    leaves.push(lv);backs.push(bk);}
  const q=(a,p)=>{const v=a.filter(x=>x!=null).sort((x,y)=>x-y);return v.length?v[Math.min(v.length-1,Math.floor(p*v.length))]:null};
  return SIMC[key]={pLeave:leaves.filter(x=>x!=null).length/N,leave:q(leaves,.5),back:q(backs,.5),backLate:q(backs,.85)};
}

const LIVE_URL='https://ntfy.sh/leo-live-8texlivbayux3f4mkn9d/json?poll=1&since=14h';
let F=null, MSG=[], SUN=null;

async function loadAll(){
  try{F=await (await fetch(`../forecast.json?t=${Date.now()}`,{cache:'no-store'})).json()}catch(_){}
  try{const txt=await (await fetch(LIVE_URL,{cache:'no-store'})).text(); const out=[];
    for(const line of txt.split('\n')){let e,m;try{e=JSON.parse(line);m=JSON.parse(e.message)}catch(_){continue}
      if(e.event!=='message'||!m||m.v!==1||typeof m.away!=='boolean'||typeof m.ts!=='number'||m.ts>Date.now()+120000) continue; out.push(m)}
    out.sort((a,b)=>a.ts-b.ts);
    let last={}; for(const m of out){ if(!(m.since>0)&&last[m.away]) m.since=last[m.away]; if(m.since>0) last[m.away]=m.since; }  // board restarts
    MSG=out;}catch(_){}
  if(!SUN){try{const r=await (await fetch('https://api.open-meteo.com/v1/forecast?latitude=52.04&longitude=-0.76&daily=sunset&timezone=Europe%2FLondon&forecast_days=1')).json();SUN=toH(r.daily.sunset[0].slice(11))}catch(_){}}
  draw();
}

// what the forecast believed at moment t: the newest status message, if it was fresh (45 min)
const stateAt=t=>{let m=null;for(const x of MSG){if(x.ts>t)break;m=x}return m&&t-m.ts<45*60000?m:null};

// how sure: the gap between "probably" and "almost certainly"
const sure=r=>{const g=(r.backLate-r.back)*60; return g<=60?'I\'m fairly sure about this one':g<=150?'I have a decent idea':'it\'s a wide guess, he could make a night of it'};

function thoughtFor(r,prev,ctx){
  const {sunset}=ctx, g=fmt(q15(r.back)), late=fmt(q15(r.backLate));
  const moved=prev?Math.round((q15(r.back)-q15(prev.back))*60):0;
  const pill=prev&&moved?`<span class="pill ${moved>0?'later':'earlier'}">${Math.abs(moved)} min ${moved>0?'later':'earlier'}</span>`:'';
  const guess=`<div class="guess"><span class="pill">My guess: home ${g}</span>${pill}</div>`;
  const outFor=r.sinceH!=null?(r.h-r.sinceH)*60:0;
  let cls=r.out?'out':'home', ev, p;
  if(!prev){
    ev=r.out?`Out since ${fmt(r.sinceH)}`:`Home since ${fmt(r.sinceH)}`;
    p=r.out?`He's been out for ${dur(outFor)}. Based on how his days usually go, I think he'll be home around <b>${g}</b>.`
           :`He's home for now. It's early, so I expect him to head out again around ${fmt(q15(r.leave))} and be back for dinner around <b>${g}</b>.`;
  } else if(r.change&&!r.out){
    ev=`He came home at ${fmt(r.sinceH)}`;
    p=r.pLeave>=.5?`It's still early and he isn't usually done for the day yet, so I don't think this is dinner. I reckon he'll pop back out around ${fmt(q15(r.leave))} and come home properly around <b>${g}</b>.`
                  :`This looks like him settling in. I'll keep dinner at about <b>${g}</b>.`;
  } else if(r.change&&r.out){
    const lag=(r.h-r.sinceH)*60;
    ev=`He went out`;
    p=lag>=20?`I last heard him at ${fmt(r.sinceH)}. I wait for 30 quiet minutes before I'm sure he's gone, so I've only just caught up. `:`He's off again. `;
    p+=moved<0?`That actually brings my guess <b>forward</b>: once he's out, he usually comes back for dinner, so I'm now expecting him around <b>${g}</b>.`
              :`I'm expecting him back around <b>${g}</b>.`;
  } else if(!r.out&&r.quiet>=10){
    ev=`It's gone quiet`;
    p=`I haven't heard him for ${Math.round(r.quiet)} minutes. He's probably slipped out, but I don't say so until it's been 30 minutes, so for now I'm still assuming he's indoors. That's why my guess is creeping later to <b>${g}</b>.`;
  } else if(r.out){
    ev=`Still out (${dur(outFor)})`;
    const dark=r.h>sunset+.25;
    if(moved>0) p=dark?`The sun went down at ${fmt(sunset)} and he's still not back. When he stays out past dusk he often makes a long evening of it, so I'm pushing my guess later, to <b>${g}</b>.`
                      :`He's still out. The longer he's away without popping back, the less likely a quick return is, so I'm nudging my guess a little later, to <b>${g}</b>.`;
    else if(moved<0) p=`Getting closer to his usual dinner time. I'm bringing my guess forward to <b>${g}</b>.`;
    else p=`Nothing surprising yet. I'm sticking with about <b>${g}</b>.`;
  } else {
    ev=`Still home`; p=`He's settled indoors. Dinner around <b>${g}</b> still looks right.`;
  }
  return {cls,ev,p,guess};
}

function draw(){
  const now=Date.now(), today=uk(now).date, nowH=uk(now).h, sunset=SUN||toH(F?.today?.weather?.sunset)||16;
  const fresh=document.getElementById('fresh'), nowEl=document.getElementById('now'), stream=document.getElementById('stream');
  if(!F||!F.model||!MSG.length){nowEl.querySelector('.big').textContent='I can\'t hear the scanner right now.';stream.innerHTML='<li class="empty">My thoughts will appear here once the scanner checks in.</li>';fresh.textContent='';return}

  // moments worth a thought: every 30 min from 11am, every out/home change, and now
  const t0=Math.max(MSG[0].ts, now-(nowH-11)*3600000), ticks=new Map();
  for(let t=Math.ceil(t0/1800000)*1800000;t<=now;t+=1800000) ticks.set(t,false);
  MSG.forEach((m,i)=>{const p=MSG[i-1]; if(m.ts>=t0&&p&&(p.away!==m.away)) ticks.set(m.ts+60000,true)});
  ticks.set(now,false);
  const rows=[...ticks.entries()].sort((a,b)=>a[0]-b[0]).map(([t,change])=>{const m=stateAt(t); if(!m) return null;
    const h=uk(t).h, sinceH=m.since>0?uk(m.since).h:null, S=simulateRest(F,today,h,m.away,sinceH,sunset);
    const quiet=(m.heard_ago_s||0)/60+(t-m.ts)/60000;
    return S&&S.back!=null?{t,h,out:m.away,sinceH,quiet,change,...S}:null}).filter(Boolean);

  // build thoughts; skip repeats that say nothing new; add a "how did I do?" when he comes home
  const thoughts=[]; let prev=null, tripGuesses=[];
  rows.forEach((r,i)=>{
    const isNow=i===rows.length-1;
    if(prev&&!r.change&&!isNow&&prev.out===r.out&&q15(prev.back)===q15(r.back)&&!(!r.out&&r.quiet>=10)) return;
    if(r.change&&!r.out&&prev&&prev.out&&tripGuesses.length&&r.pLeave<.5){  // only score the homecoming I was predicting (dinner), not a quick pop-in
      const a=r.sinceH, firstG=tripGuesses[0], lastG=tripGuesses[tripGuesses.length-1];
      const off=Math.round((a-q15(firstG.back))*60), off2=Math.round((a-q15(lastG.back))*60);
            thoughts.push({t:r.t,h:a,cls:'result',ev:'How did I do?',p:`When he went out I guessed <b>${fmt(q15(firstG.back))}</b>; he walked in at <b>${fmt(a)}</b>. ${Math.abs(off)<=15?'Spot on.':off<0?`He was ${Math.abs(off)} minutes earlier than I thought.`:`He was ${off} minutes later than I thought.`}${tripGuesses.length>1&&lastG!==firstG?` My last guess before he arrived was ${fmt(q15(lastG.back))} (${Math.abs(off2)<=15?'spot on':Math.abs(off2)+' min '+(off2<0?'too late':'too early')}).`:''}`,guess:''});
    }
    if(r.change) tripGuesses=[];
    if(r.out) tripGuesses.push(r);
    thoughts.push({t:r.t,h:r.h,isNow,...thoughtFor(r,prev,{sunset})});
    prev=r;
  });

  // right now
  const N=rows[rows.length-1], outFor=N.sinceH!=null?(nowH-N.sinceH)*60:0;
  const big=N.out?`I think Leo will be home around <em>${fmt(q15(N.back))}</em>.`
    :N.pLeave>=.5?`I think Leo will head out again around <em>${fmt(q15(N.leave))}</em>, and be home for dinner about <em>${fmt(q15(N.back))}</em>.`
    :`Leo's home. Dinner around <em>${fmt(q15(N.back))}</em>.`;
  const last=thoughts.filter(x=>x.isNow).pop();
  const clues=[
    N.sinceH!=null?`${N.out?'🚶 Out':'🏠 Home'} for ${dur(outFor)}`:null,
    nowH<sunset?`🌅 Sunset at ${fmt(sunset)}. He usually heads home around then`:`🌙 Dark since ${fmt(sunset)}`,
    `🎯 ${sure(N).replace(/^./,c=>c.toUpperCase())}. Almost certainly home by ${fmt(q15(N.backLate))}`,
  ].filter(Boolean);
  nowEl.innerHTML=`<span class="tag">Right now I'm thinking<span class="dots"><i></i><i></i><i></i></span></span><p class="big">${big}</p><p class="say">${last?last.p.replace(/<b>|<\/b>/g,''):''}</p><div class="clues">${clues.map(c=>`<span class="clue">${c}</span>`).join('')}</div>`;

  // today's train of thought, newest first (the "now" one is already shown above)
  stream.innerHTML=thoughts.filter(x=>!x.isNow).reverse().map(x=>`<li class="th"><time>${fmt(x.h)}</time><div class="bub ${x.cls}"><span class="ev">${x.ev}</span><p>${x.p}</p>${x.guess}</div></li>`).join('')||'<li class="empty">Nothing new to think about yet today.</li>';
  const age=Math.round((now-MSG[MSG.length-1].ts)/60000);
  fresh.textContent=`Listening to the scanner live · last heard from it ${age<2?'just now':age+' min ago'}. My guesses come from the same model as the forecast page, re-run every minute.`;
}
loadAll(); setInterval(loadAll,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadAll()});
</script>
</body>
</html>
