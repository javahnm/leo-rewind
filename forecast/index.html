<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leo's Forecast</title>
<meta name="description" content="What Leo the cat needs next: breakfast, snack, dinner or bedtime.">
<meta property="og:title" content="Leo's Forecast">
<meta property="og:description" content="What Leo the cat needs next.">
<meta name="theme-color" content="#f4f5f7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%88%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one screen, one answer. Status pill, then a single "next up" card. */
:root{
  --page:#f4f5f7; --card:#ffffff; --ink:#16191e; --ink-2:#4b525c; --muted:#7d848f; --line:#e3e6eb;
  --out:#eb6834; --out-bg:#fde8de; --out-ink:#8a3a12; --home-bg:#e6eefb; --home-ink:#1f4f8f; --warn-bg:#fff1cc; --warn-ink:#7a5200;
  --f-display:"Bricolage Grotesque", "Inter", system-ui, sans-serif; --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#101215; --card:#1a1d22; --ink:#eef0f3; --ink-2:#c0c6cf; --muted:#8c939d; --line:#2b3037;
  --out:#d95926; --out-bg:#3b2014; --out-ink:#f4ab89; --home-bg:#18263a; --home-ink:#9cc0ef; --warn-bg:#352a10; --warn-ink:#f0d48a; color-scheme:dark;}}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px}
.wrap{max-width:560px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:22px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.6rem;margin:0;letter-spacing:-.01em}
.top .cat{width:150px;flex:none}
.top .cat svg{max-height:44px}
.now{display:inline-flex;align-items:center;gap:9px;align-self:flex-start;border-radius:999px;padding:8px 16px;font-weight:600}
.now.out{background:var(--out-bg);color:var(--out-ink)} .now.home{background:var(--home-bg);color:var(--home-ink)}
.now i{width:9px;height:9px;border-radius:50%;background:currentColor}
@media (prefers-reduced-motion: no-preference){.now i{animation:pulse 2s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.3}}
.next{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:28px 26px 30px;display:flex;flex-direction:column;gap:10px}
.next.warn{background:var(--warn-bg);border-color:transparent}
.label{font-size:.8rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.what{font-family:var(--f-display);font-weight:800;font-size:clamp(2.1rem,9vw,3rem);line-height:1.02;letter-spacing:-.02em;text-wrap:balance}
.what em{font-style:normal;color:var(--out)}
.why{font-size:1.1rem;color:var(--ink-2)}
.count{font-size:.95rem;color:var(--muted)}
.fresh{font-size:.82rem;color:var(--muted)}
/* Leo the cat */
.cat{width:100%;color:inherit}
.cat svg{display:block;width:100%;height:auto;max-height:24cqh;overflow:visible}
.cat.sm svg{max-height:16cqh}
.card > .cat.abs{position:absolute;right:6cqw;bottom:0;width:30cqw;z-index:1}
.tail-f,.tail-s,.dangle,.wave,.leg,.eyes,.yawn,.breathe,.nod,.case,.z,.steam path,.peek,.sun,.ghost,.fresh{transform-box:fill-box}
.tail-f{transform-origin:0% 100%} .tail-s{transform-origin:100% 100%} .dangle{transform-origin:0% 0%}
.wave{transform-origin:50% 100%} .leg{transform-origin:50% 0%} .eyes{transform-origin:50% 50%}
.yawn{transform-origin:50% 0%;transform:scale(.25)} .breathe{transform-origin:50% 100%} .nod{transform-origin:0% 100%}
.ghost{opacity:.35} .z{opacity:0}
@media (prefers-reduced-motion: no-preference){
  .anim .tail-f{animation:swayF 2.6s ease-in-out infinite alternate}
  .anim .tail-s{animation:swayS 1.4s ease-in-out infinite alternate}
  .anim .dangle{animation:dangle 2.2s ease-in-out infinite alternate}
  .anim .eyes{animation:blink 4.6s infinite}
  .anim .walk .la{animation:legA .55s ease-in-out infinite alternate} .anim .walk .lb{animation:legB .55s ease-in-out infinite alternate}
  .anim .run .la{animation:legA2 .22s ease-in-out infinite alternate} .anim .run .lb{animation:legB2 .22s ease-in-out infinite alternate}
  .anim .walk .bob{animation:bob .55s ease-in-out infinite alternate}
  .anim .mover{animation:cross var(--dur,10s) linear infinite}
  .anim .peek{animation:peek 1.1s cubic-bezier(.2,.9,.2,1) both .3s}
  .anim .yawn{animation:yawn 4s ease-in-out infinite}
  .anim .sun{animation:sun 5s ease-out both}
  .anim .steam path{animation:steam 2.4s ease-in-out infinite}
  .anim .hills{animation:hills var(--dur,6s) linear infinite}
  .anim .star{animation:twinkle 2.6s ease-in-out infinite}
  .anim .breathe{animation:breathe 3.2s ease-in-out infinite alternate}
  .anim .z{animation:zz 3s ease-out infinite}
  .anim .ghost{animation:ghost 3s ease-in-out infinite alternate}
  .anim .fresh{animation:fresh 3s ease-in-out infinite alternate}
  .anim .wave{animation:waveP .5s ease-in-out infinite alternate}
  .anim .nod{animation:nod .7s ease-in-out infinite alternate}
  .anim .case{animation:swing .55s ease-in-out infinite alternate;transform-origin:50% 0%}
}
@keyframes swayF{from{transform:rotate(-6deg)}to{transform:rotate(9deg)}}
@keyframes swayS{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
@keyframes dangle{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes legA{from{transform:rotate(24deg)}to{transform:rotate(-24deg)}} @keyframes legB{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes legA2{from{transform:rotate(40deg)}to{transform:rotate(-40deg)}} @keyframes legB2{from{transform:rotate(-40deg)}to{transform:rotate(40deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(2px)}}
@keyframes cross{from{transform:translateX(var(--from,-150px))}to{transform:translateX(420px)}}
@keyframes peek{from{transform:translateY(70px)}to{transform:translateY(0)}}
@keyframes yawn{0%,55%,100%{transform:scale(.25)}70%,85%{transform:scale(1.25)}}
@keyframes sun{from{transform:translateY(46px)}to{transform:translateY(0)}}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-10px)}}
@keyframes hills{from{transform:translateX(0)}to{transform:translateX(var(--step,-200px))}}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.04,1.06)}}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-18px)}}
@keyframes ghost{from{opacity:.85}to{opacity:.12}}
@keyframes fresh{from{opacity:.25}to{opacity:1}}
@keyframes waveP{from{transform:rotate(-14deg)}to{transform:rotate(18deg)}}
@keyframes nod{from{transform:translateY(0)}to{transform:translateY(4px)}}
@keyframes swing{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}

</style>
</head>
<body>
<main class="wrap">
  <div class="top"><h1>Leo</h1><div class="cat anim" data-scene="stroll"></div></div>
  <span class="now" id="now" hidden><i></i><span></span></span>
  <section class="next" id="next">
    <span class="label">Next up</span>
    <div class="what">Checking on Leo…</div>
  </section>
  <p class="fresh" id="fresh"></p>
</main>
<script>
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
// ---------- Leo, the black cat: drawn from simple shapes, one scene per card ----------
const CAT='#111115', RIM='rgba(255,255,255,.3)', EYE='#f2d64b', COL='#ff6b35', TAG='#f4f4f4';
const SW=`stroke="${RIM}" stroke-width="1.2"`;
const eyesOpen=(l,r,y,glow)=>`<g class="eyes">${glow?`<circle cx="${l}" cy="${y}" r="11" fill="${EYE}" opacity=".2"/><circle cx="${r}" cy="${y}" r="11" fill="${EYE}" opacity=".2"/>`:''}<ellipse cx="${l}" cy="${y}" rx="6" ry="7" fill="${EYE}"/><ellipse cx="${r}" cy="${y}" rx="6" ry="7" fill="${EYE}"/><ellipse cx="${l}" cy="${y}" rx="1.8" ry="5.4" fill="#000"/><ellipse cx="${r}" cy="${y}" rx="1.8" ry="5.4" fill="#000"/></g>`;
const eyesShut=(l,r,y)=>`<g fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2" stroke-linecap="round"><path d="M${l-6} ${y} q6 4 12 0"/><path d="M${r-6} ${y} q6 4 12 0"/></g>`;
function head(o={}){ // centre (60,58), r 26
  return `<polygon points="36,48 38,20 57,37" fill="${CAT}" ${SW} stroke-linejoin="round"/><polygon points="84,48 82,20 63,37" fill="${CAT}" ${SW} stroke-linejoin="round"/>
  <polygon points="41,41 42,28 51,37" fill="#5a3344"/><polygon points="79,41 78,28 69,37" fill="#5a3344"/>
  <circle cx="60" cy="58" r="26" fill="${CAT}" ${SW}/>${o.closed?eyesShut(50,70,58):eyesOpen(50,70,57,o.glow)}
  <path d="M57 66 h6 l-3 3.5z" fill="#7a4a5a"/>
  <g stroke="rgba(255,255,255,.35)" stroke-width="1" stroke-linecap="round"><line x1="40" y1="66" x2="22" y2="63"/><line x1="40" y1="70" x2="23" y2="72"/><line x1="80" y1="66" x2="98" y2="63"/><line x1="80" y1="70" x2="97" y2="72"/></g>
  ${o.yawn?`<ellipse class="yawn" cx="60" cy="75" rx="4.5" ry="5.5" fill="#6a2236"/>`:''}`;
}
function front(o={}){ // sitting, facing you. box 0 0 120 142
  return `<g class="tail-f"><path d="M82 130 C 114 130, 118 94, 102 82" fill="none" stroke="${CAT}" stroke-width="9" stroke-linecap="round"/></g>
  <ellipse cx="60" cy="106" rx="30" ry="32" fill="${CAT}" ${SW}/><ellipse cx="49" cy="136" rx="9" ry="6" fill="${CAT}" ${SW}/>
  ${o.wave?`<g class="wave"><path d="M80 104 L95 70" stroke="${RIM}" stroke-width="15.5" stroke-linecap="round"/><path d="M80 104 L95 70" stroke="${CAT}" stroke-width="13" stroke-linecap="round"/><circle cx="96" cy="66" r="8.5" fill="${CAT}" ${SW}/></g>`:`<ellipse cx="71" cy="136" rx="9" ry="6" fill="${CAT}" ${SW}/>`}
  <g>${head(o)}</g>
  <rect x="42" y="83" width="36" height="5" rx="2.5" fill="${COL}"/><circle cx="60" cy="92" r="5" fill="${TAG}" stroke="#8a9199" stroke-width="1"/>`;
}
function sideHead(o){ return `<polygon points="108,26 111,6 121,20" fill="${CAT}" ${SW} stroke-linejoin="round"/><polygon points="122,20 131,6 135,26" fill="${CAT}" ${SW} stroke-linejoin="round"/>
  <circle cx="121" cy="34" r="17" fill="${CAT}" ${SW}/>
  ${o.closed?`<path d="M124 33 q4 3 8 0" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.8" stroke-linecap="round"/>`:`<g class="eyes"><ellipse cx="128" cy="32" rx="3.6" ry="4.4" fill="${EYE}"/><ellipse cx="128.8" cy="32" rx="1.1" ry="3.6" fill="#000"/></g>`}
  <path d="M136 37 l3 1.6 -3 1.6z" fill="#7a4a5a"/><g stroke="rgba(255,255,255,.35)" stroke-width="1"><line x1="132" y1="41" x2="148" y2="39"/><line x1="132" y1="43" x2="147" y2="46"/></g>`; }
function side(o={}){ // walking right. box 0 0 160 86, feet at y 84
  const gait=o.run?'run':o.still?'still':'walk';
  const leg=(c,x)=>`<rect class="leg ${c}" x="${x}" y="54" width="9" height="30" rx="4.5" fill="${CAT}"/>`;
  return `<g class="${gait}"><g class="tail-s"><path d="M32 46 C 14 40, 10 22, 18 10" fill="none" stroke="${CAT}" stroke-width="8" stroke-linecap="round"/></g>
  ${leg('la',38)}${leg('lb',51)}${leg('lb',90)}${leg('la',103)}
  <ellipse cx="72" cy="52" rx="42" ry="18" fill="${CAT}" ${SW}/>
  <rect x="103" y="40" width="6" height="18" rx="3" fill="${COL}" transform="rotate(-25 106 49)"/><circle cx="109" cy="59" r="3.8" fill="${TAG}" stroke="#8a9199" stroke-width="1"/>
  ${o.down?`<g class="nod"><g transform="translate(4 26)">${sideHead(o)}</g></g>`:`<g class="bob">${sideHead(o)}</g>`}
  ${o.brief?`<g class="case"><line x1="137" y1="42" x2="137" y2="58" stroke="#2a2a2a" stroke-width="2"/><rect x="125" y="58" width="25" height="17" rx="2.5" fill="#8a5a2b" stroke="#5a3a1a" stroke-width="1.2"/><path d="M133 58 v-3 h9 v3" fill="none" stroke="#5a3a1a" stroke-width="2"/></g>`:''}</g>`;
}
const at=(x,y,s,inner)=>`<g transform="translate(${x} ${y}) scale(${s})">${inner}</g>`;
const ground=(y,w=400,op=.22)=>`<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="${op}"/>`;
const SCENES={
  peek:()=>[`0 0 120 100`,`<g class="peek">${at(0,18,1,head({}))}<ellipse cx="40" cy="99" rx="11" ry="8" fill="${CAT}" ${SW}/><ellipse cx="80" cy="99" rx="11" ry="8" fill="${CAT}" ${SW}/></g>`],
  stroll:()=>[`0 0 400 96`,`${ground(92)}<g class="mover" style="--dur:11s">${at(0,20,.85,side())}</g>`],
  dash:()=>[`0 0 400 96`,`${ground(92)}<g class="mover" style="--dur:3.2s">${at(0,20,.85,side({run:true}))}</g><g class="mover" style="--dur:3.2s;animation-delay:-1.6s">${at(0,20,.85,side({run:true}))}</g>`],
  sunrise:()=>[`0 0 240 150`,`<g class="sun"><circle cx="190" cy="78" r="34" fill="#ffe27a"/></g>${ground(146,240,.3)}${at(30,4,1,front({yawn:true}))}`],
  away:()=>[`0 0 400 104`,`${ground(100)}<path d="M18 84 h50 l-7 15 h-36z" fill="currentColor" opacity=".8"/><text x="43" y="76" text-anchor="middle" font-size="11" fill="currentColor" opacity=".7" font-family="JetBrains Mono, monospace">empty</text><g class="mover" style="--dur:7s;--from:70px">${at(0,28,.85,side())}</g>`],
  eat:()=>[`0 0 230 112`,`${ground(108,230)}${at(10,24,1,side({still:true,down:true}))}<path d="M130 94 h46 l-6 14 h-34z" fill="${COL}"/><g fill="#8a5a2b"><circle cx="142" cy="93" r="3"/><circle cx="150" cy="91" r="3"/><circle cx="160" cy="93" r="3"/></g>`],
  tea:()=>[`0 0 240 150`,`${at(20,4,1,front())}<g class="steam" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity=".55"><path d="M168 100 q-6 -8 0 -16 q6 -8 0 -16"/><path d="M184 100 q-6 -8 0 -16 q6 -8 0 -16" style="animation-delay:-1s"/></g><path d="M156 108 h44 v12 a22 18 0 0 1 -44 0z" fill="#fff"/><path d="M199 112 q16 3 0 16" fill="none" stroke="#fff" stroke-width="4"/><ellipse cx="178" cy="144" rx="34" ry="4.5" fill="#fff"/>`],
  hike:()=>[`0 0 400 124`,`<g class="hills" style="--dur:9s;--step:-400px"><path d="M0 124 V96 Q100 40 200 96 T400 96 T600 96 T800 96 V124Z" fill="rgba(32,196,172,.28)"/></g><g class="hills" style="--dur:4s;--step:-200px"><path d="M0 124 V108 Q50 84 100 108 T200 108 T300 108 T400 108 T500 108 T600 108 V124Z" fill="rgba(32,196,172,.5)"/></g>${at(130,40,.85,side())}`],
  door:()=>[`0 0 400 100`,`${ground(96)}<rect x="176" y="8" width="52" height="88" rx="3" fill="none" stroke="currentColor" stroke-width="4" opacity=".75"/><rect x="180" y="12" width="44" height="84" fill="currentColor" opacity=".12"/><g class="mover" style="--dur:2.6s">${at(0,24,.85,side({run:true}))}</g>`],
  moon:()=>[`0 0 220 170`,`<g fill="#f5e9b8"><circle class="star" cx="20" cy="20" r="2"/><circle class="star" cx="196" cy="40" r="1.6" style="animation-delay:-1s"/><circle class="star" cx="170" cy="12" r="1.4" style="animation-delay:-2s"/></g><rect x="0" y="148" width="220" height="10" rx="2" fill="#2a3152"/><g fill="#2a3152"><rect x="14" y="120" width="8" height="50"/><rect x="198" y="120" width="8" height="50"/></g>${at(50,8,1,front({glow:true}))}`],
  chair:()=>[`0 0 180 150`,`<rect x="134" y="20" width="12" height="78" rx="3" fill="#8a5632"/><rect x="20" y="92" width="132" height="12" rx="3" fill="#a0683c"/><rect x="28" y="104" width="8" height="44" rx="2" fill="#8a5632"/><rect x="134" y="104" width="8" height="44" rx="2" fill="#8a5632"/>
     <g class="dangle"><path d="M112 90 C 120 104, 112 122, 120 140" fill="none" stroke="${CAT}" stroke-width="7" stroke-linecap="round"/></g>
     <ellipse cx="84" cy="76" rx="42" ry="18" fill="${CAT}" ${SW}/><ellipse cx="58" cy="91" rx="10" ry="4.5" fill="${CAT}" ${SW}/>
     <rect x="54" y="66" width="4" height="16" rx="2" fill="${COL}" transform="rotate(-20 56 74)"/>${at(46,64,.62,`<g transform="translate(-60 -58)">${head({closed:true})}</g>`)}`],
  sleep:()=>[`0 0 190 124`,`<path d="M32 82 C 26 112, 108 116, 132 96" fill="none" stroke="${CAT}" stroke-width="11" stroke-linecap="round"/><g class="breathe"><ellipse cx="82" cy="72" rx="52" ry="30" fill="${CAT}" ${SW}/></g>${at(124,68,.7,`<g transform="translate(-60 -58)">${head({closed:true})}</g>`)}
     <g fill="currentColor" font-family="Bricolage Grotesque, sans-serif" font-weight="800"><text class="z" x="150" y="40" font-size="16">z</text><text class="z" x="160" y="30" font-size="20" style="animation-delay:-1s">z</text><text class="z" x="172" y="18" font-size="24" style="animation-delay:-2s">z</text></g>`],
  twins:()=>[`0 0 280 146`,`<g class="ghost">${at(10,2,1,front())}</g><g class="fresh">${at(150,2,1,front())}</g>`],
  tiny:()=>[`0 0 400 56`,`<g class="mover" style="--dur:12s">${at(0,8,.55,side())}</g>`],
  commute:()=>[`0 0 400 100`,`${ground(96)}<g class="mover" style="--dur:8s">${at(0,24,.85,side({brief:true}))}</g>`],
  wave:()=>[`0 0 130 145`,front({wave:true})],
};
function drawCats(){
  document.querySelectorAll('[data-scene]').forEach(el=>{const [vb,inner]=SCENES[el.dataset.scene]();
    el.innerHTML=`<svg viewBox="${vb}" aria-hidden="true" overflow="visible">${inner}</svg>`;});
  const clk=document.getElementById('clock'); if(!clk) return;
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.innerHTML=`<line x1="0" y1="0" x2="0" y2="-70" stroke="${COL}" stroke-width="3" stroke-linecap="round">${reduce?'':'<animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="12s" repeatCount="indefinite"/>'}</line>${at(-27,-36,.45,front())}`;
  clk.appendChild(g);
}
drawCats();

</script>
<script>
const toH=s=>{if(!s)return null;const [h,m]=s.split(':').map(Number);return h+m/60};
const fmt=x=>{if(x==null)return'–';x=((x%24)+24)%24;let h=Math.floor(x),m=Math.round((x-h)*60);if(m===60){h=(h+1)%24;m=0}
  if(h===12&&m===0)return'noon';const ap=h<12?'am':'pm';const hh=h%12||12;return m?`${hh}:${String(m).padStart(2,'0')}${ap}`:`${hh}${ap}`};
const q15=x=>Math.round(x*4)/4, r5=x=>Math.round(x*12)/12;
const ukParts=()=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {date:`${p.year}-${p.month}-${p.day}`,h:+p.hour+(+p.minute)/60}};
const inT=(from,to)=>{const m=Math.round((to-from)*60);if(m<=0)return'';if(m<60)return`in ${m} min`;const h=Math.floor(m/60),r=m%60;return`in ${h}h${r?` ${String(r).padStart(2,'0')}m`:''}`};
let F=null;

// today's plan: the live card if it's for today, otherwise today's forecast from the day list
const STALE_MIN=150;
const isStale=F=>(Date.now()-new Date(F.generated))/60000>STALE_MIN;
// Live status straight from the scanner (it posts on every out/home change + every 20 min).
const LIVE_URL='https://ntfy.sh/leo-live-8texlivbayux3f4mkn9d/json?poll=1&since=3h';
let L=null;
const liveFresh=()=>!!(L&&Date.now()-L.ts<45*60000);
const ukHM=ms=>new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(ms));
async function loadLive(){
  try{
    const txt=await (await fetch(LIVE_URL,{cache:'no-store'})).text();
    let best=null;
    for(const line of txt.split('\n')){
      let e,m; try{e=JSON.parse(line);m=JSON.parse(e.message)}catch(_){continue}
      // only well-formed status messages; anything else on the channel is ignored
      if(e.event!=='message'||!m||m.v!==1||typeof m.away!=='boolean'||typeof m.ts!=='number'||m.ts>Date.now()+120000||m.ts<Date.now()-864e5) continue;
      if(!best||m.ts>best.ts) best=m;
    }
    if(best){L=best;render();}
  }catch(_){}
}
function today(F,date){
  const base=todayBase(F,date); if(!base) return null;
  if(liveFresh()){const st=L.away?'out':'home', same=base.state===st;
    return {...base,state:st,since:L.since>0?ukHM(L.since):(same?base.since:null)};}
  return isStale(F)?{...base,state:null}:base;
}
// Fallback for days not in the published forecast: Leo's learned habits + today's sun times,
// fetched by the browser itself (no server, no Mac).
let SUN={};
async function loadSun(){
  try{const r=await (await fetch('https://api.open-meteo.com/v1/forecast?latitude=52.04&longitude=-0.76&daily=sunrise,sunset,temperature_2m_min,temperature_2m_max,precipitation_sum&timezone=Europe%2FLondon&forecast_days=3')).json();
    r.daily.time.forEach((d,i)=>SUN[d]={sunrise:r.daily.sunrise[i].slice(11),sunset:r.daily.sunset[i].slice(11),t_min:r.daily.temperature_2m_min[i],t_max:r.daily.temperature_2m_max[i],rain_mm:r.daily.precipitation_sum[i]});
    render();}catch(_){}
}
function fromHabits(F,date){
  const P=F.params, s=SUN[date]; if(!P||!s) return null;
  const we=[0,6].includes(new Date(date+'T12:00:00Z').getUTCDay()), ex=we?P.exit_weekend_min:P.exit_weekday_min, tv=P.tea_vs_sunset_min;
  const sr=toH(s.sunrise), ss=toH(s.sunset), hm=x=>{const h=Math.floor(x),m=Math.round((x-h)*60);return `${String(h).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`};
  return {date,exit:hm(sr+ex[0]/60),tea:hm(ss+tv[0]/60),tea_range:[hm(ss+tv[1]/60),hm(ss+tv[2]/60)],weather:s};
}
function todayBase(F,date){
  if(F.today&&F.today.date===date) return F.today;
  const d=(F.days||[]).find(x=>x.date===date)||fromHabits(F,date);
  return d?{date,state:null,since:null,events:[],exit_actual:null,exit_expected:d.exit,tea_actual:null,tea_expected:d.tea,tea_range:d.tea_range,weather:d.weather}:null;
}
function tomorrowExit(F,date){let d=(F.days||[]).find(x=>x.date>date);
  if(!d){const k=Object.keys(SUN).find(x=>x>date); d=k&&fromHabits(F,k);} return d?toH(d.exit):null}

function decide(F){
  const {date,h}=ukParts(), T=today(F,date), H=F.habits||{}, snack=toH(H.snack), bed=toH(H.bedtime)||21.5;
  if(!T) return {label:'Next up',what:'Waiting for fresh data',why:'The forecast will be back shortly.'};
  if(T.state==null) return byClock(T,h,snack,bed,F,date);
  const out=T.state==='out', exitE=toH(T.exit_expected), tea=toH(T.tea_expected), teaEnd=T.tea_range?toH(T.tea_range[1]):tea+.75;
  const left=!!T.exit_actual||out||(T.events||[]).length>0||(!T.exit_actual&&!(T.events||[]).length&&h>exitE+1);
  const popped=(T.events||[]).some((e,i,a)=>e.back&&a[i+1]&&toH(e.back)>=9.5&&toH(e.back)<=12);
  const teaDone=!!T.tea_actual||(!out&&h>=13&&left);
  const bfast=x=>({label:'Breakfast',what:`Have it down by <em>${fmt(q15(x-10/60))}</em>`,why:`He'll head out around ${fmt(r5(x))}.`,at:q15(x-10/60)});

  if(h<5) return bfast(exitE);
  if(!left) return bfast(exitE);
  if(!teaDone&&h<12&&snack&&!popped&&h<snack+.75){
    if(!out) return {label:'Snack',what:'He\'s popped in',why:'Probably after a snack. He\'ll likely head out again soon.'};
    return {label:'Snack',what:`Around <em>${fmt(q15(snack))}</em>`,why:'He often pops in mid-morning. Leave a little something out.',at:q15(snack)};
  }
  if(!teaDone){
    const ready=q15(tea-10/60);
    if(h<tea) return {label:'Dinner',what:`Get it ready for <em>${fmt(ready)}</em>`,why:`He should be home around ${fmt(r5(tea))}.`,at:ready};
    if(h<teaEnd) return {label:'Dinner',what:'He\'s due home <em>any minute</em>',why:`He's usually back by ${fmt(q15(teaEnd))}.`};
    return {label:'Dinner',what:'Running late for dinner',why:`He's usually home by ${fmt(q15(teaEnd))}. Worth a look outside.`,warn:true};
  }
  if(out&&h>=22.5) return {label:'Bedtime',what:'Time to call him in',why:`He's still out, and it's past 10:30pm.`,warn:true};
  if(out) return {label:'Bedtime',what:`Check on him at <em>10:30pm</em>`,why:'He\'s out for an evening stroll. He\'s usually back within the hour.',at:22.5};
  if(h<bed) return {label:'Bedtime',what:`He's in for the night by <em>~${fmt(q15(bed))}</em>`,why:'If he pops out again, check on him at 10:30pm.',at:q15(bed)};
  const te=tomorrowExit(F,date);
  return te?{...bfast(te),label:'Tomorrow\'s breakfast',at:null}:{label:'Bedtime',what:'He\'s in for the night',why:'Sleep well, Leo.'};
}

function byClock(T,h,snack,bed,F,date){  // live data paused: follow his usual day
  const exitE=toH(T.exit_actual||T.exit_expected), tea=toH(T.tea_actual||T.tea_expected), teaEnd=T.tea_range?toH(T.tea_range[1]):tea+.75;
  const bfast=x=>({label:'Breakfast',what:`Have it down by <em>${fmt(q15(x-10/60))}</em>`,why:`He usually heads out around ${fmt(r5(x))}.`,at:q15(x-10/60)});
  if(h<exitE) return bfast(exitE);
  if(snack&&h<snack+.5) return {label:'Snack',what:`Around <em>${fmt(q15(snack))}</em>`,why:'He often pops in mid-morning. Leave a little something out.',at:q15(snack)};
  if(h<tea) return {label:'Dinner',what:`Get it ready for <em>${fmt(q15(tea-10/60))}</em>`,why:`He's usually home around ${fmt(r5(tea))}.`,at:q15(tea-10/60)};
  if(h<teaEnd) return {label:'Dinner',what:'He\'s due home <em>about now</em>',why:`He's usually back by ${fmt(q15(teaEnd))}.`};
  if(h<22.5) return {label:'Bedtime',what:`Check he's in by <em>10:30pm</em>`,why:`He's usually in for the night by about ${fmt(q15(bed))}.`,at:22.5};
  const te=tomorrowExit(F,date);
  return te?{...bfast(te),label:'Tomorrow\'s breakfast',at:null}:{label:'Bedtime',what:'He should be in for the night',why:'Sleep well, Leo.'};
}

function render(){
  if(!F) return;
  const {h,date}=ukParts(), n=decide(F), T=today(F,date);
  const pill=document.getElementById('now');
  const stale=!T||T.state==null;
  if(stale) pill.hidden=true;
  else if(T&&T.since){pill.hidden=false;pill.className=`now ${T.state}`;pill.querySelector('span').textContent=`${T.state==='out'?'Out':'Home'} since ${fmt(toH(T.since))}`;}
  const el=document.getElementById('next');
  el.className='next'+(n.warn?' warn':'');
  el.innerHTML=`<span class="label">Next up · ${n.label}</span><div class="what">${n.what}</div>${n.why?`<p class="why">${n.why}</p>`:''}${n.at!=null&&n.at>h?`<p class="count">${inT(h,n.at)}</p>`:''}`;
  const age=Math.round((Date.now()-new Date(F.generated))/60000);
  document.getElementById('fresh').textContent=stale?`Following his usual routine. Live updates paused (last one ${age<1440?Math.round(age/60)+' h':Math.round(age/1440)+' days'} ago).`
    :(()=>{const a2=liveFresh()?Math.round((Date.now()-L.ts)/60000):age;return a2<2?'Live · just updated':`Live · updated ${a2} min ago`})();
}
async function load(){try{const r=await fetch(`forecast.json?t=${Date.now()}`,{cache:'no-store'});F=await r.json();render();}catch(e){}}
load(); loadLive(); loadSun(); setInterval(loadSun,6*3600000); setInterval(load,300000); setInterval(loadLive,60000); setInterval(render,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){load();loadLive()}});
</script>
