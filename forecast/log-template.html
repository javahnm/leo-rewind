<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leo's Forecast Today</title>
<meta name="description" content="How Leo's dinner forecast moved today, live.">
<meta name="theme-color" content="#f4f5f7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%88%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* One chart: each row is what the forecast said at that moment; the bar runs to when it expected him home. */
:root{
  --page:#f4f5f7; --card:#ffffff; --ink:#16191e; --ink-2:#4b525c; --muted:#7d848f; --line:#e3e6eb; --grid:#eceef2;
  --out:#e2622c; --out-soft:#f6c3ad; --home:#2f6fd1; --home-soft:#bcd2f3; --real:#16191e;
  --f-display:"Bricolage Grotesque", "Inter", system-ui, sans-serif; --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#111316; --card:#1a1d22; --ink:#eef0f3; --ink-2:#b9bfc8; --muted:#8a919b; --line:#2b3038; --grid:#23272e;
  --out:#f07a45; --out-soft:#6b3420; --home:#6a9df0; --home-soft:#24406b; --real:#eef0f3;}}
:root[data-theme="dark"]{
  --page:#111316; --card:#1a1d22; --ink:#eef0f3; --ink-2:#b9bfc8; --muted:#8a919b; --line:#2b3038; --grid:#23272e;
  --out:#f07a45; --out-soft:#6b3420; --home:#6a9df0; --home-soft:#24406b; --real:#eef0f3;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:400 16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.6rem;margin:0;letter-spacing:-.01em}
.sub{margin:4px 0 0;color:var(--ink-2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 18px}
.key{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.85rem;color:var(--ink-2);margin:0 0 10px}
.key span{display:inline-flex;align-items:center;gap:7px}
.sw{width:18px;height:4px;border-radius:2px;display:inline-block}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font:500 11px var(--f-body);fill:var(--muted)}
svg .rowlab{font-size:11.5px;fill:var(--ink-2);font-variant-numeric:tabular-nums}
svg .hit{fill:transparent;cursor:default}
svg .hit:hover{fill:var(--grid)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--page);font-size:.85rem;padding:8px 10px;border-radius:10px;max-width:260px;opacity:0;transition:opacity .1s;z-index:5}
h2{font-family:var(--f-display);font-weight:800;font-size:1.15rem;margin:0 0 10px}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
ol li{display:grid;grid-template-columns:64px 1fr;gap:10px}
ol b{font-weight:600;font-variant-numeric:tabular-nums}
ol p{margin:0;color:var(--ink-2)}
ol strong{color:var(--ink);font-weight:600}
.fresh{font-size:.82rem;color:var(--muted)}
a{color:inherit}
.empty{color:var(--muted);margin:8px 0}
</style>
</head>
<body>
<main class="wrap">
  <div><h1>How today's forecast moved</h1>
  <p class="sub">Each line is what the forecast said at that moment. The line runs to when it expected Leo home. Updates by itself.</p></div>
  <section class="card">
    <div class="key">
      <span><i class="sw" style="background:var(--out)"></i>He was out</span>
      <span><i class="sw" style="background:var(--home)"></i>He was home</span>
      <span><i class="dot" style="background:var(--ink)"></i>Expected home</span>
      <span><i class="sw" style="background:var(--grid);border:1px solid var(--line)"></i>Almost certainly by</span>
      <span><i class="sw" style="width:2px;height:12px;background:var(--ink-2)"></i>He came home</span>
    </div>
    <div id="chart"><p class="empty">Loading today…</p></div>
  </section>
  <section class="card"><h2>What changed the forecast</h2><ol id="moments"></ol></section>
  <p class="fresh" id="fresh"></p>
  <p class="fresh"><a href="../">← Back to Leo's forecast</a></p>
</main>
<div class="tip" id="tip"></div>
<script>
const toH=s=>{if(!s)return null;const [h,m]=s.split(':').map(Number);return h+m/60};
const fmt=x=>{if(x==null)return'–';x=((x%24)+24)%24;let h=Math.floor(x),m=Math.round((x-h)*60);if(m===60){h=(h+1)%24;m=0}
  if(h===12&&m===0)return'noon';const ap=h<12?'am':'pm';const hh=h%12||12;return m?`${hh}:${String(m).padStart(2,'0')}${ap}`:`${hh}${ap}`};
const q15=x=>Math.round(x*4)/4;
const uk=ms=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(ms)).map(x=>[x.type,x.value]));
  return {date:`${p.year}-${p.month}-${p.day}`,h:+p.hour+(+p.minute)/60}};
__SIM__
const LIVE_URL='https://ntfy.sh/leo-live-8texlivbayux3f4mkn9d/json?poll=1&since=14h';
let F=null, MSG=[], SUN=null;

async function loadAll(){
  try{F=await (await fetch(`../forecast.json?t=${Date.now()}`,{cache:'no-store'})).json()}catch(_){}
  try{const txt=await (await fetch(LIVE_URL,{cache:'no-store'})).text(); const out=[];
    for(const line of txt.split('\n')){let e,m;try{e=JSON.parse(line);m=JSON.parse(e.message)}catch(_){continue}
      if(e.event!=='message'||!m||m.v!==1||typeof m.away!=='boolean'||typeof m.ts!=='number'||m.ts>Date.now()+120000) continue; out.push(m)}
    out.sort((a,b)=>a.ts-b.ts);
    let last={}; for(const m of out){ if(!(m.since>0)&&last[m.away]) m.since=last[m.away]; if(m.since>0) last[m.away]=m.since; }  // board restarts
    MSG=out;}catch(_){}
  if(!SUN){try{const r=await (await fetch('https://api.open-meteo.com/v1/forecast?latitude=52.04&longitude=-0.76&daily=sunset&timezone=Europe%2FLondon&forecast_days=1')).json();SUN=toH(r.daily.sunset[0].slice(11))}catch(_){}}
  draw();
}

// what the page believed at moment t: the newest status message, if it was fresh (45 min)
const stateAt=t=>{let m=null;for(const x of MSG){if(x.ts>t)break;m=x}return m&&t-m.ts<45*60000?m:null};

function draw(){
  const now=Date.now(), today=uk(now).date, nowH=uk(now).h, sunset=SUN||toH(F?.today?.weather?.sunset)||16;
  const fresh=document.getElementById('fresh');
  if(!F||!F.model||!MSG.length){document.getElementById('chart').innerHTML='<p class="empty">No live updates from the scanner in the last few hours.</p>';fresh.textContent='';return}
  // moments: every 30 min from 11am (dinner forecasts start then) + every status change
  const t0=Math.max(MSG[0].ts, Date.parse(today+'T00:00:00Z')+0), ticks=new Set();
  const dayStart=now-(nowH-11)*3600000;
  for(let t=Math.ceil(Math.max(t0,dayStart)/1800000)*1800000;t<=now;t+=1800000) ticks.add(t);
  const changes=[]; MSG.forEach((m,i)=>{const p=MSG[i-1]; if(m.ts>=Math.max(t0,dayStart)&&(!p||p.away!==m.away||(p.since!==m.since&&m.since>0))){ticks.add(m.ts+60000);changes.push(m)}});
  ticks.add(now);
  const rows=[...ticks].sort((a,b)=>a-b).map(t=>{const m=stateAt(t); if(!m) return null;
    const h=uk(t).h, sinceH=m.since>0?uk(m.since).h:null, S=simulateRest(F,today,h,m.away,sinceH,sunset);
    const quiet=(m.heard_ago_s||0)/60+(t-m.ts)/60000;
    return S&&S.back!=null?{t,h,out:m.away,sinceH,quiet,...S}:null}).filter(Boolean)
    .filter((r,i,a)=>!(i&&a[i-1].out===r.out&&a[i-1].back===r.back&&a[i-1].backLate===r.backLate&&r.t!==now&&r.h-a[i-1].h<.49));
  // real out/home spells (back-dated to when the scanner last heard him)
  const spells=[]; let cur=null; for(const m of MSG){ if(!(m.since>0)) continue; if(!cur||cur.away!==m.away){ if(cur) cur.end=m.since; cur={away:m.away,start:m.since}; spells.push(cur)} } if(cur) cur.end=now;
  const arrivals=spells.filter((s,i)=>!s.away&&i>0&&uk(s.start).date===today).map(s=>uk(s.start).h);

  // ---- chart geometry
  const W=Math.max(340,Math.min(720,document.getElementById('chart').clientWidth||720)), L=W<500?62:92, R=14, top=34, rh=26, H=top+rows.length*rh+30;
  const x0=Math.floor(Math.min(...rows.map(r=>r.h),12)), x1=Math.min(24,Math.ceil(Math.max(nowH+.5,...rows.map(r=>r.backLate||r.back))+.25));
  const X=h=>L+(h-x0)/(x1-x0)*(W-L-R);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Forecast of when Leo would be home, as it changed through the day">`;
  for(let h=x0;h<=x1;h++){const x=X(h);s+=`<line x1="${x}" x2="${x}" y1="${top-6}" y2="${H-24}" stroke="var(--grid)"/>`;if((h-x0)%(x1-x0>8?2:1)===0)s+=`<text x="${x}" y="${H-8}" text-anchor="middle">${fmt(h).replace(':00','')}</text>`}
  // status strip
  spells.forEach(sp=>{const a=Math.max(x0,uk(sp.start).date===today?uk(sp.start).h:x0), b=Math.min(x1,uk(sp.end).h); if(b>a) s+=`<rect x="${X(a)}" y="8" width="${X(b)-X(a)}" height="8" rx="4" fill="var(--${sp.away?'out':'home'})"/>`});
  s+=`<text x="${L-10}" y="16" text-anchor="end">Leo</text>`;
  const vline=(h,label,dash)=>{if(h<x0||h>x1)return'';const x=X(h);return `<line x1="${x}" x2="${x}" y1="${top-8}" y2="${H-24}" stroke="var(--ink-2)" stroke-width="1.5" ${dash?'stroke-dasharray="3 4"':''}/><text x="${x+4}" y="${top-12}" style="fill:var(--ink-2)">${label}</text>`};
  s+=vline(sunset,'sunset',true);
  arrivals.forEach(a=>s+=vline(a,'',false));
  s+=`<line x1="${X(nowH)}" x2="${X(nowH)}" y1="${top-8}" y2="${H-24}" stroke="var(--out)" stroke-width="2"/>`;
  rows.forEach((r,i)=>{const y=top+i*rh+rh/2, c=r.out?'out':'home';
    const tip=`${fmt(r.h)} · ${r.out?'out':'home'}${r.sinceH!=null?' since '+fmt(r.sinceH):''}<br>${!r.out&&r.leave!=null?`Expected out again ~${fmt(q15(r.leave))}<br>`:''}Expected home ~${fmt(q15(r.back))}<br>Almost certainly by ${fmt(q15(r.backLate))}`;
    s+=`<rect class="hit" x="0" y="${y-rh/2}" width="${W}" height="${rh}" data-tip="${tip}"/>`;
    s+=`<text class="rowlab" x="${L-10}" y="${y+4}" text-anchor="end">${r.t===now?'now':fmt(r.h)}</text>`;
    s+=`<line x1="${X(r.back)}" x2="${X(r.backLate)}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="6" stroke-linecap="round"/>`;
    s+=`<line x1="${X(r.h)}" x2="${X(r.back)}" y1="${y}" y2="${y}" stroke="var(--${c})" stroke-width="3" stroke-linecap="round"/>`;
    if(!r.out&&r.leave!=null) s+=`<circle cx="${X(r.leave)}" cy="${y}" r="4" fill="var(--card)" stroke="var(--${c})" stroke-width="2"/>`;
    s+=`<circle cx="${X(r.h)}" cy="${y}" r="3" fill="var(--${c})"/><circle cx="${X(r.back)}" cy="${y}" r="5" fill="var(--ink)" stroke="var(--card)" stroke-width="2"/>`;
  });
  s+='</svg>';
  document.getElementById('chart').innerHTML=s;

  // ---- plain-English moments
  const li=[]; let prevBack=null;
  rows.forEach(r=>{const isChange=changes.some(m=>Math.abs(m.ts+60000-r.t)<1000), first=prevBack==null;
    const moved=prevBack!=null?Math.round((r.back-prevBack)*60):0;
    if(first||isChange||Math.abs(moved)>=30||r.t===now){
      const what=first?(r.out?'Out':'Home')+(r.sinceH!=null?' since '+fmt(r.sinceH):''):r.t===now?(r.out?'Still out':'Home')+(!r.out&&r.quiet>=10?` (as far as the scanner knows: not heard for ${Math.round(r.quiet)} min)`:''):(isChange?(r.out?`He went out${r.sinceH!=null?' (last heard '+fmt(r.sinceH)+')':''}`:`He came home${r.sinceH!=null?' at '+fmt(r.sinceH):''}`):(r.out?`Still out`:`Still home`+(r.quiet>=10?` (as far as the scanner knew: it hadn't heard him for ${Math.round(r.quiet)} min, and needs 30 to be sure he's gone)`:'')));
      const exp=`expected home <strong>${fmt(q15(r.back))}</strong>`+(!r.out&&r.leave!=null?` after another trip out around ${fmt(q15(r.leave))}`:'');
      const why=first?'':moved>0?` (${moved} min later)`:moved<0?` (${-moved} min earlier)`:' (no change)';
      li.push(`<li><b>${r.t===now?'Now':fmt(r.h)}</b><p>${what}: ${exp}${why}.</p></li>`);}
    prevBack=r.back;});
  document.getElementById('moments').innerHTML=li.join('');
  const age=Math.round((now-MSG[MSG.length-1].ts)/60000);
  fresh.textContent=`Live from the scanner · last update ${age<2?'just now':age+' min ago'}. Each line re-runs the same model the forecast page uses.`;
}
const tip=document.getElementById('tip');
document.addEventListener('pointermove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.style.opacity=0;return}
  tip.innerHTML=t.dataset.tip;tip.style.opacity=1;const w=tip.offsetWidth;tip.style.left=Math.min(innerWidth-w-8,e.clientX+12)+'px';tip.style.top=(e.clientY+14)+'px'});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(draw,150)});
loadAll(); setInterval(loadAll,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadAll()});
</script>
</body>
</html>
